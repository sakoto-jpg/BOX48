services:
  snh48-backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    image: snh48-downloader-snh48-backend:vaapi   # 含 Intel VAAPI 驱动（当前 registry 不可达时用本地镜像）
    container_name: snh48-downloader-backend
    restart: unless-stopped
    ports:
      - "8095:8000"
    volumes:
      - ./backend/app:/app
      - ./config:/config
      - ./cookie:/cookie
      - /mnt/nas/anime/video/live48:/downloads
      - /root/emby-config:/emby-config   # Emby 元数据目录（人物头像/剧集封面写入）
      - /var/spool/cron/crontabs:/host-crontabs   # 宿主机 crontab（设置页可改刷新策略）
    devices:
      - /dev/dri:/dev/dri   # Intel Quick Sync（VAAPI/QSV），直播转码用
    environment:
      - TZ=Asia/Shanghai
      - CONFIG_PATH=/config/roster.yaml
      - COOKIE_PATH=/cookie/cookies.txt
      - DOWNLOAD_PATH=/downloads
      - EMBY_METADATA_PATH=/emby-config/metadata
      - EMBY_PATH_ROOT=/mnt/nas/anime/video/live48   # Emby 上报的宿主路径
      - CRONTAB_PATH=/host-crontabs/root             # 定时任务文件（原地写，权限不变）

  # ---------- 新增前端服务 ----------
  snh48-frontend:
    image: nginx:alpine
    container_name: snh48-downloader-frontend
    restart: unless-stopped
    ports:
      - "8090:80"   # 使用 8090 端口访问网页端面板
    volumes:
      - ./frontend:/usr/share/nginx/html:ro  # 挂载前端代码目录
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro  # 入口页禁用强缓存

  # ---------- 公演排期服务(由 snh48-calendar 合并而来) ----------
  snh48-calendar:
    build:
      context: ./calendar
      dockerfile: Dockerfile
    container_name: snh48-calendar
    restart: unless-stopped
    depends_on:
      - snh48-backend
    ports:
      - "8099:8000"   # 保持原 calendar 项目端口，API 与日历订阅地址不变
    volumes:
      - ./config:/config   # 与下载器共用 SQLite，公演排期存 performances 表
    environment:
      - TZ=Asia/Shanghai
      - SCHEDULE_DB=/config/snh48.db
